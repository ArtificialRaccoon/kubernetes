apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: media
  labels:
    app: startpage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: startpage
  template:
    metadata:
      labels:
        app: startpage
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html-volume
          persistentVolumeClaim:
            claimName: pvc-nfs-startpage
        - name: config-volume
          configMap:
            name: startpage-nginx-config
