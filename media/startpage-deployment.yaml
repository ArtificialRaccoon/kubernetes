apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nfs-startpage
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs
  nfs:
    server: 10.27.27.250
    path: /volume1/web
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-nfs-startpage
  namespace: media
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: startpage-nginx-config
  namespace: media
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: media
  labels:
    app: startpage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: startpage
  template:
    metadata:
      labels:
        app: startpage
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: html-volume
          persistentVolumeClaim:
            claimName: pvc-nfs-startpage
        - name: config-volume
          configMap:
            name: startpage-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: startpage
  namespace: media
  labels:
    app: startpage
spec:
  type: ClusterIP
  selector:
    app: startpage
  ports:
    - name: webui
      port: 80
      targetPort: 80
